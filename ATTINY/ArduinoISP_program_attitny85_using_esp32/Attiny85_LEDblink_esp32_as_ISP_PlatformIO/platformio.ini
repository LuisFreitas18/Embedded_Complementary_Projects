[env:attiny85]
platform = atmelavr
board = attiny85
framework = arduino
monitor_speed = 115200

; Frequência interna do ATtiny85 (1MHz ou 8MHz)
board_build.f_cpu = 8000000L

; Protocolo de Upload via ArduinoISP
upload_protocol = custom
upload_speed = 115200

; Serial Port where the ESP32 is connected (adjust as needed)
upload_port = COM3

; Flags do avrdude para usar o ESP32 como programador STK500v1
upload_flags =
    -C
    ${platformio.packages_dir}/tool-avrdude/avrdude.conf
    -p
    $BOARD_MCU
    -P
    $UPLOAD_PORT
    -b
    $UPLOAD_SPEED
    -c
    stk500v1

; Força a execução explícita do avrdude com as flags acima
upload_command = "${platformio.packages_dir}/tool-avrdude/avrdude" $UPLOAD_FLAGS -U flash:w:$SOURCE:i


; Comando opcional para gravar os Fuses (definir clock a 8MHz interno)
board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xDF
board_fuses.efuse = 0xFF