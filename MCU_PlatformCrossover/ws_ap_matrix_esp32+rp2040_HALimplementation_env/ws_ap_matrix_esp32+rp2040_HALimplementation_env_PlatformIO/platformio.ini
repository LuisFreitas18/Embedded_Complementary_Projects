[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
extra_scripts = pre:load_ap_env.py

build_flags = 
  -D USING_ESP32



[env:rp2040w]
platform = raspberrypi
board = pico
framework = arduino
monitor_speed = 115200
extra_scripts = pre:load_ap_env.py

build_flags = 
  -D USING_RP2040W
